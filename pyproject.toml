[project]
name = "gtp-cp"
version = "0.1.0"
description = "Gene-to-Phenotype Causal Transformer (Causal-STFM) - clean research codebase scaffold."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GTP-CP" }]
license = { text = "MIT" }

dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torch>=2.7",  # RTX 5060 (Blackwell) requires PyTorch 2.7+ with CUDA 12.8
  "requests>=2.32",
  "omegaconf>=2.3",
  "hydra-core>=1.3",
  "tqdm>=4.66",
  "rich>=13.7",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
pyg = [
  # Prefer installing PyG via conda (see docs/ENV_SETUP.md) on Windows.
  "torch-geometric>=2.5",
]
wsi = [
  # Optional: only needed if you want to read SVS/NDPI directly in Python.
  # On Windows, conda-forge often works better than pip.
  "openslide-python>=1.3.1",
  "pillow>=10.4",
  "timm>=1.0.0",  # For UNI/CONCH pathology foundation models
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
gtp-train = "gtp_cp.cli.train:main"
gtp-eval = "gtp_cp.cli.eval:main"
gtp-brca-manifest = "gtp_cp.pipelines.brca.manifest:main"
gtp-brca-clinical = "gtp_cp.pipelines.brca.clinical:main"
gtp-brca-split = "gtp_cp.pipelines.brca.split:main"
gtp-brca-graphs = "gtp_cp.pipelines.brca.graphs:main"
gtp-brca-train = "gtp_cp.pipelines.brca.train:main"
gtp-brca-gdc-manifest = "gtp_cp.pipelines.brca.gdc_manifest:main"
gtp-brca-tile = "gtp_cp.pipelines.brca.tiling:main"
gtp-brca-features = "gtp_cp.pipelines.brca.features:main"
gtp-brca-preprocess = "gtp_cp.pipelines.brca.preprocess:main"
gtp-brca-demo = "gtp_cp.pipelines.brca.demo_data:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"


